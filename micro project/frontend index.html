<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Language Translator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    textarea { width: 100%; height: 100px; }
    select, button { margin-top: 10px; padding: 8px; font-size: 16px; }
    #output { margin-top: 20px; white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; }
  </style>
</head>
<body>
  <h1>Language Translator (ML-powered)</h1>
  <textarea id="inputText" placeholder="Enter text to translate"></textarea>
  <br/>
  <select id="languageSelect">
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <option value="hi">Hindi</option>
    <option value="zh">Chinese</option>
  </select>
  <br/>
  <button onclick="translateText()">Translate</button>

  <div id="output"></div>

  <script>
    async function translateText() {
      const text = document.getElementById('inputText').value;
      const targetLanguage = document.getElementById('languageSelect').value;
      if (!text) {
        alert("Please enter some text.");
        return;
      }
      const response = await fetch('http://localhost:8000/translate/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text, target_language: targetLanguage})
      });
      const data = await response.json();
      document.getElementById('output').innerText = data.translated_text || "Translation failed.";
    }
  </script>
</body>
</html>
